<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff">
<title>Gallery</title>
<style>
:root{--black:#000;--white:#fff;--line:2px solid #000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;background:#fff;color:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
body{padding-bottom:150px}
button,input{font:inherit;color:#000}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1.5px solid #000;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand,.count,.pill,#add{border:1.5px solid #000;background:#fff;border-radius:999px}.brand{padding:9px 20px;font-weight:900;font-size:15px;letter-spacing:.5px}.count{padding:9px 16px;font-size:12px;font-weight:800}
main{width:min(720px,100%);margin:auto;padding:16px 14px}.feed{display:flex;flex-direction:column;gap:16px}
.card{border:1.5px solid #000;border-radius:28px;overflow:hidden;background:#fff}.media{width:100%;background:#fff}.media img{display:block;width:100%;height:auto;max-height:78vh;object-fit:contain}.media video{display:block;width:100%;max-height:78vh;background:#fff}.fileph{padding:58px 16px;text-align:center;font-size:15px;font-weight:900;letter-spacing:3px}
.info{padding:14px 12px 12px;border-top:1.5px solid #000;display:flex;flex-direction:column;gap:10px}.fname{font-size:14.5px;font-weight:900;line-height:1.35;word-break:break-word}.fsize{font-size:11.5px;font-weight:700;opacity:.6}.row{display:flex;gap:10px}.pill{flex:1;padding:12px 14px;font-size:13.5px;font-weight:900;cursor:pointer}.pill:active{background:#000;color:#fff}
#empty{border:1.5px dashed #000;border-radius:28px;padding:46px 20px;text-align:center;font-weight:900;line-height:1.7}
#add{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));width:92px;height:92px;z-index:40;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(0,0,0,.16);cursor:pointer}#add:active{transform:translateX(-50%) scale(.93)}
#prog,#toast{position:fixed;left:50%;transform:translateX(-50%);z-index:60;border:1.5px solid #000;border-radius:999px;background:#fff;font-size:12.5px;font-weight:900;text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.14)}
#prog{display:none;bottom:calc(132px + env(safe-area-inset-bottom));padding:12px 22px;max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#toast{display:none;top:calc(14px + env(safe-area-inset-top));padding:12px 22px;max-width:90vw}
#fileInput{display:none}
</style>
</head>
<body>
<header><div class="brand">GALLERY</div><div class="count" id="count">0 items</div></header>
<main><div id="empty">Abhi kuch upload nahi hua.<br>Neeche wale bade <b>+</b> button se upload karo.</div><div class="feed" id="feed"></div></main>
<div id="prog"></div><div id="toast"></div>
<button id="add" aria-label="Upload files"><svg width="46" height="46" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 5v30M5 20h30" stroke="#000" stroke-width="4.5" stroke-linecap="round"/></svg></button>
<input id="fileInput" type="file" multiple>
<script src="/socket.io/socket.io.js"></script>
<script>
const feed=document.getElementById('feed'),empty=document.getElementById('empty'),count=document.getElementById('count'),add=document.getElementById('add'),input=document.getElementById('fileInput'),prog=document.getElementById('prog'),toastEl=document.getElementById('toast');
let files=[]; const socket=io();
let owner=localStorage.getItem('gallery_owner_token');
if(!owner){ owner=crypto.randomUUID()+crypto.randomUUID(); localStorage.setItem('gallery_owner_token',owner); }
function toast(s){toastEl.textContent=s;toastEl.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.style.display='none',2600)}
function size(n){let u=['B','KB','MB','GB','TB'],i=0,x=n||0;while(x>=1024&&i<u.length-1){x/=1024;i++}return (i?x.toFixed(x<10?1:0):x)+' '+u[i]}
function render(){count.textContent=files.length+(files.length===1?' item':' items');feed.innerHTML='';empty.style.display=files.length?'none':'block';for(const f of files)feed.appendChild(card(f))}
function card(f){const c=document.createElement('article');c.className='card';const m=document.createElement('div');m.className='media';if((f.type||'').startsWith('image/')){const x=document.createElement('img');x.src=f.url;x.alt='';x.loading='lazy';m.appendChild(x)}else if((f.type||'').startsWith('video/')){const x=document.createElement('video');x.src=f.url;x.controls=true;x.playsInline=true;x.preload='metadata';m.appendChild(x)}else{const x=document.createElement('div');x.className='fileph';x.textContent='FILE';m.appendChild(x)}c.appendChild(m);const info=document.createElement('div');info.className='info';const nm=document.createElement('div');nm.className='fname';nm.textContent=f.name||'file';info.appendChild(nm);const meta=document.createElement('div');meta.className='fsize';meta.textContent=size(f.size)+'  •  '+new Date(f.createdAt).toLocaleString();info.appendChild(meta);const row=document.createElement('div');row.className='row';const dl=document.createElement('button');dl.className='pill';dl.textContent='Download';dl.onclick=()=>download(f);const del=document.createElement('button');del.className='pill';del.textContent='Delete';del.onclick=()=>remove(f);row.append(dl,del);info.appendChild(row);c.appendChild(info);return c}
async function load(){const r=await fetch('/api/files');if(!r.ok)throw new Error('load');files=await r.json();render()}
function download(f){const a=document.createElement('a');a.href=f.url;a.download=f.name||'file';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
async function remove(f){if(!confirm('Ye file delete karni hai?'))return;const r=await fetch('/api/files/'+encodeURIComponent(f.id),{method:'DELETE',headers:{'x-owner-token':owner}});const j=await r.json().catch(()=>({}));if(!r.ok){toast(j.error||'Delete fail hua');return}toast('Delete ho gaya')}
function showProg(s){prog.textContent=s;prog.style.display='block'}function hideProg(){prog.style.display='none'}
async function uploadAll(list){const arr=[...list];if(!arr.length)return;const fd=new FormData();arr.forEach(f=>fd.append('files',f,f.name));showProg('Upload ho raha hai...');try{const r=await fetch('/api/upload',{method:'POST',headers:{'x-owner-token':owner},body:fd});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'upload fail');toast(arr.length===1?'Upload ho gaya ✅':arr.length+' files upload ho gaye ✅')}catch(e){toast(e.message||'Upload fail hua')}finally{hideProg()}}
add.onclick=()=>input.click();input.onchange=()=>{uploadAll(input.files);input.value=''};
document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files.length)uploadAll(e.dataTransfer.files)});
socket.on('file:added',f=>{if(!files.some(x=>x.id===f.id)){files.unshift(f);render()}});socket.on('file:deleted',id=>{files=files.filter(x=>x.id!==id);render()});socket.on('connect',()=>{});
load().catch(()=>toast('Server se files load nahi hui'));render();
</script>
</body>
</html>
