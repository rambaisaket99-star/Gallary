<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Public Core Storage</title>
    <style>
        /* Core Reset & Clean Light Theme */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        body { 
            background-color: #ffffff; 
            color: #000000; 
            padding: 20px; 
            padding-bottom: 120px; 
        }
        
        header { 
            max-width: 800px; 
            margin: 0 auto 30px auto; 
            text-align: left; 
        }
        header h1 { 
            font-size: 28px; 
            font-weight: 800; 
            letter-spacing: -0.5px; 
        }
        
        /* Capsulized Drop Zone */
        #drop-zone { 
            max-width: 800px; 
            margin: 0 auto 30px auto; 
            border: 2px dashed #000000; 
            border-radius: 30px; 
            padding: 50px 20px; 
            text-align: center; 
            cursor: pointer; 
            transition: background 0.2s ease; 
        }
        #drop-zone.dragover { 
            background: #f0f0f0; 
        }
        #drop-zone p { 
            font-size: 16px; 
            font-weight: 600; 
        }
        #file-input { 
            display: none; 
        }

        /* Infinite Scroll Layout Stream */
        #feed { 
            max-width: 800px; 
            margin: 0 auto; 
            display: flex; 
            flex-direction: column; 
            gap: 25px; 
        }
        
        /* Capsulized File Cards */
        .card { 
            background: #ffffff; 
            border: 2px solid #000000; 
            border-radius: 28px; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        
        /* HD Preview Blocks */
        .media-preview { 
            width: 100%; 
            border-radius: 18px; 
            background: #fafafa; 
            border: 1px solid #e0e0e0; 
            max-height: 500px; 
            object-fit: contain; 
        }
        
        .generic-file-icon {
            width: 100%;
            padding: 40px;
            text-align: center;
            background: #f9f9f9;
            border-radius: 18px;
            border: 1px dashed #cccccc;
            font-size: 40px;
        }
        
        .card-info { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            width: 100%; 
            gap: 15px;
        }
        .filename { 
            font-weight: 700; 
            font-size: 15px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            max-width: 50%; 
        }
        
        /* Action Buttons with Capsule Shape */
        .actions { 
            display: flex; 
            gap: 10px; 
        }
        .btn { 
            padding: 10px 20px; 
            border-radius: 50px; 
            border: 2px solid #000000; 
            background: #ffffff; 
            color: #000000; 
            font-size: 13px; 
            font-weight: 700; 
            text-decoration: none; 
            cursor: pointer; 
            transition: all 0.1s ease; 
            display: inline-flex;
            align-items: center;
        }
        .btn:active { 
            background: #000000; 
            color: #ffffff; 
        }
        .btn-delete { 
            background: #ffffff; 
            border-color: #000000; 
        }

        /* Big Floating Plus Icon for Mobile & iPad */
        #floating-plus { 
            position: fixed; 
            bottom: 35px; 
            right: 35px; 
            width: 70px; 
            height: 70px; 
            background: #000000; 
            color: #ffffff; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 42px; 
            font-weight: 300; 
            cursor: pointer; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.2); 
            z-index: 1000; 
            border: none; 
            transition: transform 0.1s ease;
        }
        #floating-plus:active { 
            transform: scale(0.92); 
        }
    </style>
</head>
<body>

    <header>
        <h1>PUBLIC FEED</h1>
    </header>

    <!-- Upload Selection Area -->
    <div id="drop-zone">
        <p>Drop original HD files here or click to select</p>
        <input type="file" id="file-input" multiple>
    </div>

    <!-- Scroll Feed Stream -->
    <div id="feed"></div>

    <!-- Big Floating Action Button -->
    <button id="floating-plus">+</button>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const floatingPlus = document.getElementById('floating-plus');
        const feed = document.getElementById('feed');

        // Click triggers for upload
        dropZone.addEventListener('click', () => fileInput.click());
        floatingPlus.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFiles);

        // Drag & Drop event bindings
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                processFiles(e.dataTransfer.files);
            }
        });

        function handleFiles(e) {
            if (e.target.files.length > 0) {
                processFiles(e.target.files);
            }
        }

        // Processing Local HD Uploads natively via Blobs (Preserves Original Quality)
        function processFiles(files) {
            Array.from(files).forEach(file => {
                const fileUrl = URL.createObjectURL(file);
                const fileData = {
                    id: 'file-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9),
                    name: file.name,
                    type: file.type,
                    url: fileUrl
                };
                
                createFileCard(fileData);
            });
        }

        // Generates UI Elements for Uploaded Files
        function createFileCard(file) {
            const card = document.createElement('div');
            card.className = 'card';
            card.id = file.id;

            // HD Rendering Core logic
            if (file.type.startsWith('image/')) {
                const img = document.createElement('img');
                img.src = file.url;
                img.className = 'media-preview';
                card.appendChild(img);
            } else if (file.type.startsWith('video/')) {
                const video = document.createElement('video');
                video.src = file.url;
                video.className = 'media-preview';
                video.controls = true;
                video.playsInline = true;
                card.appendChild(video);
            } else {
                // For document zip files or others
                const fallback = document.createElement('div');
                fallback.className = 'generic-file-icon';
                fallback.textContent = '📄';
                card.appendChild(fallback);
            }

            // Details and actions structure
            const info = document.createElement('div');
            info.className = 'card-info';

            const name = document.createElement('div');
            name.className = 'filename';
            name.textContent = file.name;

            const actions = document.createElement('div');
            actions.className = 'actions';

            const downloadBtn = document.createElement('a');
            downloadBtn.href = file.url;
            downloadBtn.download = file.name;
            downloadBtn.className = 'btn';
            downloadBtn.textContent = 'DOWNLOAD HD';

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'btn btn-delete';
            deleteBtn.textContent = 'DELETE';
            deleteBtn.onclick = () => card.remove();

            actions.appendChild(downloadBtn);
            actions.appendChild(deleteBtn);
            info.appendChild(name);
            info.appendChild(actions);
            card.appendChild(info);

            // Pushes new files instantly to top of the scroll stream
            feed.insertBefore(card, feed.firstChild);
        }
    </script>
</body>
</html>
